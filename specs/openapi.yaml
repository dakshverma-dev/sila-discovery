components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: scb_session
    demoCapability:
      type: apiKey
      in: cookie
      name: scb_demo
  schemas:
    Health: *id005
    DemoSession: *id006
    DemoRole: *id007
    VenueInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        timezone:
          type: string
          const: Europe/London
      required:
      - name
      - timezone
    ExperienceInput:
      type: object
      additionalProperties: false
      properties:
        venue_organisation_id: *id001
        title:
          type: string
          minLength: 1
          maxLength: 150
        description: *id008
        access_support:
          type: array
          items:
            type: string
            enum:
            - step_free
            - seating
            - quiet_space
            - hearing_support
          minItems: 0
          maxItems: 100
          uniqueItems: true
        approval_status:
          type: string
          enum:
          - DRAFT
          - APPROVED
      required:
      - venue_organisation_id
      - title
      - description
      - access_support
    AnchorInput:
      type: object
      additionalProperties: false
      properties:
        entity_id:
          type: string
          minLength: 1
          maxLength: 150
        subtype:
          const: urn:entity:book
        mapping_reason: *id008
        expected_version:
          type: integer
          minimum: 1
      required:
      - entity_id
      - subtype
      - mapping_reason
      - expected_version
    QuoteInput:
      type: object
      additionalProperties: false
      properties:
        fixed_pence:
          type: integer
          minimum: 0
        variable_pence:
          type: integer
          minimum: 0
        minimum_venue_charge_pence:
          type: integer
          minimum: 0
        platform_fee_pence:
          type: integer
          minimum: 0
        ticket_pence:
          type: integer
          minimum: 0
        venue_min_seats:
          type: integer
          minimum: 1
        currency:
          const: GBP
        expected_version:
          type: integer
          minimum: 1
      required:
      - fixed_pence
      - variable_pence
      - minimum_venue_charge_pence
      - platform_fee_pence
      - ticket_pence
      - venue_min_seats
      - currency
      - expected_version
    SlotInput:
      type: object
      additionalProperties: false
      properties:
        start_at: *id002
        end_at: *id002
        capacity:
          type: integer
          minimum: 1
        expected_version:
          type: integer
          minimum: 1
      required:
      - start_at
      - end_at
      - capacity
      - expected_version
    GroupInput:
      type: object
      additionalProperties: false
      properties:
        organisation_id: *id001
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - organisation_id
      - name
    InviteInput:
      type: object
      additionalProperties: false
      properties:
        expires_at: *id002
        maximum_uses:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - expires_at
      - maximum_uses
    InviteTokenInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
      required:
      - token
    BriefInput:
      type: object
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 0
        budget_pence:
          type: integer
          minimum: 0
        expected_seats:
          type: integer
          minimum: 1
          maximum: 100
        availability:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              start_at: *id002
              end_at: *id002
            required:
            - start_at
            - end_at
          minItems: 1
          maxItems: 10
          uniqueItems: true
        sharing_consent:
          type: boolean
        external_query_consent:
          type: boolean
        access_requirements:
          type: array
          items:
            type: string
            enum:
            - step_free
            - seating
            - quiet_space
            - hearing_support
          minItems: 0
          maxItems: 100
          uniqueItems: true
        references:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              input_label:
                type: string
                minLength: 1
                maxLength: 200
              entity_id:
                type:
                - string
                - 'null'
              declared_meaning: *id008
            required:
            - input_label
            - entity_id
          minItems: 3
          maxItems: 8
          uniqueItems: true
      required:
      - expected_version
      - budget_pence
      - expected_seats
      - availability
      - sharing_consent
      - external_query_consent
      - access_requirements
      - references
    ResolveInput:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
        take:
          type: integer
          minimum: 1
          maximum: 5
      required:
      - query
      - take
    MatchRunInput:
      type: object
      additionalProperties: false
      properties:
        group_ids:
          type: array
          items: *id001
          minItems: 2
          maxItems: 20
          uniqueItems: true
        experience_ids:
          type: array
          items: *id001
          minItems: 1
          maxItems: 10
          uniqueItems: true
        expected_brief_versions:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
      required:
      - group_ids
      - experience_ids
      - expected_brief_versions
    JobResponse: *id003
    ProposalResponse: *id004
    PublishInput:
      type: object
      additionalProperties: false
      properties:
        proposal_version_id: *id001
        expected_version:
          type: integer
          minimum: 1
        deadline: *id002
      required:
      - proposal_version_id
      - expected_version
      - deadline
    DecisionInput:
      type: object
      additionalProperties: false
      properties:
        proposal_version_id: *id001
        expected_version:
          type: integer
          minimum: 1
        group_id: *id001
        decision:
          type: string
          enum:
          - ACCEPT
          - DECLINE
        reason_category:
          type: string
          enum:
          - SUBJECT
          - INTERPRETATION
          - COST
          - TIME
          - ACCESS
          - SHARING
          - OTHER
        reason: *id008
      required:
      - proposal_version_id
      - expected_version
      - group_id
      - decision
    ReservationInput:
      type: object
      additionalProperties: false
      properties:
        proposal_version_id: *id001
        expected_version:
          type: integer
          minimum: 1
        group_id: *id001
        accept_shared_session:
          const: true
        adult_declaration:
          const: true
      required:
      - proposal_version_id
      - expected_version
      - group_id
      - accept_shared_session
      - adult_declaration
    VersionInput:
      type: object
      additionalProperties: false
      properties:
        proposal_version_id: *id001
        expected_version:
          type: integer
          minimum: 1
      required:
      - proposal_version_id
      - expected_version
    CancelInput:
      type: object
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - expected_version
      - reason
    CompletionInput:
      type: object
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
        attended_reservation_ids:
          type: array
          items: *id001
          minItems: 0
          maxItems: 100
          uniqueItems: true
      required:
      - expected_version
      - attended_reservation_ids
    ConsentInput:
      type: object
      additionalProperties: false
      properties:
        purpose: *id009
        notice_version:
          type: string
        accepted:
          type: boolean
      required:
      - purpose
      - notice_version
      - accepted
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            field_errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
                minItems: 0
                maxItems: 100
                uniqueItems: true
            retryable:
              type: boolean
          required:
          - code
          - message
          - retryable
        meta:
          type: object
          additionalProperties: false
          properties:
            request_id: *id001
          required:
          - request_id
      required:
      - error
      - meta
    SuccessEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: false
          properties:
            request_id: *id001
            source_mode:
              type: string
              enum:
              - live
              - cached
              - synthetic
              - unavailable
          required:
          - request_id
      required:
      - data
      - meta
    ExportResponse: *id010
    DeletionResponse: *id011
    WithdrawalResponse: *id012
    VenueList: *id013
security:
- bearerAuth: []
- sessionCookie: []
